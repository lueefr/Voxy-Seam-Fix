// Voxy Seam Fix -- NeoForge 1.21.1 port.
//
// Built with ModDevGradle on the exact toolchain the NeoForge 1.21.1 voxy ports use
// (see falling-colud/voxy-forged): NeoForge 21.1.x, Java 21, official Mojang mappings.
// No mixin annotation processor / refmap is needed because NeoForge ships Minecraft with
// official names at runtime, so every class and method selector used by the mixins below is
// already spelled the way it exists at runtime.

plugins {
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// ---------------------------------------------------------------------------
// Voxy is "all rights reserved" and is not published to any maven, so this project never links
// against it directly. Instead it compiles against a handful of compile-only stubs (src/voxyStubs)
// that mirror exactly the members this mod references. The stubs are never packaged -- see the
// `jar` block below -- and at runtime everything comes from whichever voxy jar the player uses.
// ---------------------------------------------------------------------------
sourceSets {
    voxyStubs
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        voxySeamFix {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly sourceSets.voxyStubs.output
}

tasks.named('compileJava', JavaCompile) {
    dependsOn tasks.named('voxyStubsClasses')
}

processResources {
    def props = [
            'version'                : project.mod_version,
            'minecraft_version_range': project.minecraft_version_range,
            'neoforge_version_range' : project.neoforge_version_range
    ]
    inputs.properties(props)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = project.java_version as int
}

jar {
    // Belt and braces: the compile-only voxy stubs must never ship, otherwise they would shadow
    // the real voxy classes and break every mixin.
    exclude 'me/cortex/**'

    manifest {
        attributes([
                'Specification-Title'   : 'voxy-seam-fix',
                'Specification-Vendor'  : 'HTRMC',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'HTRMC'
        ])
    }
}

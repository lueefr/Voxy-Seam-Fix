# Build and Release workflow for Voxy Seam Fix (NeoForge 1.21.1).
#
#   1. Every push (any branch) and every pull request targeting "master" compiles the mod.
#   2. Updates that land on "master" also publish the compiled .jar as a GitHub Release, so there
#      is always a ready-to-download build in the "Releases" section of the repository.
#   3. Pull requests only build the .jar (as a temporary workflow artifact) and never publish a
#      Release, so unreviewed code cannot ship by accident.

name: Build and Release

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build .jar
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # NeoForge 21.1 / Minecraft 1.21.1 is a Java 21 target.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Read mod version
        id: version
        run: |
          version="$(grep -E '^mod_version=' gradle.properties | cut -d '=' -f 2- | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::Could not read mod_version from gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Mod version: $version"

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Build mod
        run: ./gradlew --no-daemon --stacktrace build

      # The jar must contain the NeoForge metadata and the mixin config, and must NOT contain any of
      # the compile-only voxy stubs (they would shadow the real voxy classes and break every mixin).
      - name: Inspect and sanity check the jar
        id: jar
        run: |
          jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)"
          if [ -z "$jar" ]; then
            echo "::error::No .jar found in build/libs after the build"
            exit 1
          fi

          echo "Built jar: $jar"
          unzip -l "$jar"

          for required in META-INF/neoforge.mods.toml voxyseamfix.mixins.json \
                          me/htrmc/voxyseamfix/VoxySeamFix.class \
                          me/htrmc/voxyseamfix/ShaderPatcher.class \
                          me/htrmc/voxyseamfix/mixin/ShaderLoaderMixin.class; do
            if ! unzip -l "$jar" | grep -qF "$required"; then
              echo "::error::$jar is missing $required"
              exit 1
            fi
          done

          if unzip -l "$jar" | grep -qE ' me/cortex/'; then
            echo "::error::$jar contains compile-only voxy stubs (me/cortex/**), refusing to publish"
            exit 1
          fi

          echo "path=$jar" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: voxy-seam-fix-1.21.1-${{ github.sha }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    # Releases only for code that is already on "master": direct pushes to master, or a manual run
    # started from master. Pull requests use a "refs/pull/..." ref, so they never match this.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download the built jar
        uses: actions/download-artifact@v7
        with:
          name: voxy-seam-fix-1.21.1-${{ github.sha }}
          path: artifact

      - name: Publish jar to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          MOD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          jar="$(find artifact -maxdepth 1 -type f -name '*.jar' | sort | head -n 1)"
          if [ -z "$jar" ]; then
            echo "::error::No .jar found in the downloaded artifact"
            exit 1
          fi

          echo "Publishing $jar as release $RELEASE_TAG"
          release_title="Voxy Seam Fix v${MOD_VERSION} for NeoForge 1.21.1 (${GITHUB_SHA::7})"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$jar" --clobber
          else
            gh release create "$RELEASE_TAG" "$jar" \
              --title "$release_title" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

name: Gradle CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build mod
        run: ./gradlew --no-daemon build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: voxy-seam-fix-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
